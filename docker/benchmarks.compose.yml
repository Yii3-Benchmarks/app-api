x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 45s
  ulimits:
    nofile: {soft: 65536, hard: 65536}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-http-health: &http-health
  interval: 30s
  timeout: 5s
  start_period: 30s
  start_interval: 2s
  retries: 3

services:
  frankenphp-classic:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:80/') === false ? 1 : 0);"]
    profiles: [frankenphp-classic]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: frankenphp-classic
    ports: ["9991:80"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  frankenphp-worker:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:80/') === false ? 1 : 0);"]
    profiles: [frankenphp-worker]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: frankenphp-worker
    ports: ["9991:80"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  roadrunner:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    profiles: [roadrunner]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: roadrunner
    ports: ["9991:8080"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  php:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
    profiles: [php-fpm]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: php-fpm
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  nginx:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    profiles: [php-fpm]
    image: nginx:1.31.6-alpine
    ports: ["9991:80"]
    volumes: ["../:/app", "./runtimes/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: {php: {condition: service_healthy}}

  freeunit:
    <<: *runtime
    profiles: [freeunit]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: freeunit
    ports: ["9991:80"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    healthcheck:
      <<: *http-health
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = unitd && curl --fail --silent http://localhost/ > /dev/null"]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  rapira:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    profiles: [rapira]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: rapira
    ports: ["9991:8080"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  rapira-classic:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    profiles: [rapira-classic]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: rapira
    command: ["rapira", "serve", "--config", "docker/runtimes/rapira-classic.toml"]
    ports: ["9991:8080"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  rapira-dispatcher:
    <<: *runtime
    healthcheck:
      <<: *http-health
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    profiles: [rapira-dispatcher]
    build:
      context: ..
      dockerfile: docker/runtimes/Dockerfile
      target: rapira
    command: ["rapira", "serve", "--config", "docker/runtimes/rapira-dispatcher.toml"]
    ports: ["9991:8080"]
    volumes: ["../:/app"]
    env_file: [dev/.env]
    depends_on: {postgres: {condition: service_healthy}, valkey: {condition: service_healthy}}

  valkey:
    <<: *runtime
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 2s, retries: 30}

  postgres:
    <<: *runtime
    image: postgres:18.6-alpine
    command: -c max_connections=200
    environment: {POSTGRES_DB: benchmark, POSTGRES_USER: benchmark, POSTGRES_PASSWORD: benchmark}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"], interval: 2s, timeout: 2s, retries: 30}
    volumes: ["./postgres/initdb.d:/docker-entrypoint-initdb.d:ro"]

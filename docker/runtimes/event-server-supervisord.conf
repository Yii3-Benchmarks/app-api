[supervisord]
nodaemon=true
user=root
logfile=/dev/null
loglevel=warn
pidfile=/tmp/benchmark-supervisord.pid

[program:php-worker]
command=php /app/worker-%(ENV_BENCH_RUNTIME)s.php
directory=/app
process_name=%(program_name)s_%(process_num)02d
numprocs=20
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
